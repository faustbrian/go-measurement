schema_version: 1
tool_version: v1.0.14
tool_checksums_sha256: 88341d2f2904925b22ec8de084fec68c5229669f1119f066ed5fccd76aee2f82
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
  - module: .
    archive: .verification/mutation/bootstrap/root.zip
    ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
  - module: .
    mode: go-doc
    path: api/baseline.txt
    packages:
    - .
    - ./measurementwire
operations:
- module: .
  gate: test
  steps:
  - type: make
    makefile: verification/package.mk
    target: architecture
    timeout: 20m
  - type: make
    makefile: verification/package.mk
    target: security
    timeout: 20m
- module: .
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: .
  gate: fuzz
  steps:
  - type: go-test
    packages: [.]
    fuzz: '^FuzzParseAndTextRoundTrip$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzQuantityJSON$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzQuantityXMLAndSQL$'
    budget: 10000x
    timeout: 20m
- module: .
  gate: benchmark
  steps:
  - type: go-test
    packages: [./...]
    benchmark: Benchmark
    budget: 100ms
    timeout: 20m
