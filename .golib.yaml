schema_version: 1
tool_version: v2.3.0
tool_checksums_sha256: 639af50cddd7dbcc45561a067dd0f361abbddaf1ba5810c680b4fc5b0ba2c10b
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
  - module: .
    archive: .verification/mutation/bootstrap/root.zip
    ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
  - module: .
    mode: go-doc
    path: api/v3.txt
    packages:
    - .
    - ./adapters/wire
    - ./measurementwire
operations:
- module: .
  gate: local-test
  steps:
  - type: go-test
    packages: [.]
    run: '^TestContextIsNotRetainedAcrossConcurrentCalls$'
    race: true
    count: 1
    timeout: 2m
- module: .
  gate: interoperability
  steps:
  - type: go-test
    packages: [.]
    run: '^Test(DBSchenkerEuroPalletLoadingMetreFixture|CarrierVolumetricWeightFixtures|DSVEuroPalletVolumetricIndexFixture)$'
    count: 1
    timeout: 20m
- module: .
  gate: conformance
  steps:
  - type: go-test
    packages: [.]
    run: '^Test(EveryFiniteUnitRatioAgainstCanonicalUnit|OfficialExactUnitDefinitions|EveryUnitHasTheAuditedSymbolAndDimension|FahrenheitUsesExactDefinedRatioBeforeRounding|TemperatureConversionRequiresExplicitRounding|RoundedConversionRoundsOnlyTheFinalRatio|ZeroConversionContextDoesNotInferRoundingPolicy|DerivedDimensionsSelectCanonicalUnits|DerivedDimensionIdentitiesAndCommutativity|DivideMassByVolumeAndMultiplyDensityByVolume|AbsoluteTemperaturesRejectAffineArithmetic|ParsingUsesOnlyExplicitProfileAliases|UnitCatalogIsStableSortedAndAliasSafe|DBSchenkerEuroPalletLoadingMetreFixture|CarrierVolumetricWeightFixtures|DSVEuroPalletVolumetricIndexFixture|DimensionsCalculateLoadingMetresWithStacking|VolumetricDivisorUsesExplicitVolumeUnit)$'
    count: 1
    timeout: 20m
- module: .
  gate: test
  steps:
  - type: make
    makefile: verification/package.mk
    target: architecture
    timeout: 20m
  - type: make
    makefile: verification/package.mk
    target: security
    timeout: 20m
- module: .
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: .
  gate: fuzz
  steps:
  - type: go-test
    packages: [.]
    fuzz: '^FuzzParseAndTextRoundTrip$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzQuantityJSON$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzQuantityXMLAndSQL$'
    budget: 10000x
    timeout: 20m
- module: .
  gate: benchmark
  steps:
  - type: go-test
    packages: [./...]
    benchmark: Benchmark
    budget: 100ms
    timeout: 20m
