  imports:
  - module: .
    archive: .verification/mutation/bootstrap/root.zip
    ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
  - module: .
    mode: go-doc
    path: api/baseline.txt
    packages:
    - .
    - ./measurementwire
operations:
- module: .
  gate: interoperability
  steps:
  - type: go-test
    packages: [.]
    run: '^Test(DBSchenkerEuroPalletLoadingMetreFixture|CarrierVolumetricWeightFixtures|DSVEuroPalletVolumetricIndexFixture)$'
    count: 1
    timeout: 20m
- module: .
  gate: conformance
  steps:
  - type: go-test
    packages: [.]
    run: '^Test(EveryFiniteUnitRatioAgainstCanonicalUnit|OfficialExactUnitDefinitions|EveryUnitHasTheAuditedSymbolAndDimension|FahrenheitUsesExactDefinedRatioBeforeRounding|TemperatureConversionRequiresExplicitRounding|RoundedConversionRoundsOnlyTheFinalRatio|ZeroConversionContextDoesNotInferRoundingPolicy|DerivedDimensionsSelectCanonicalUnits|DerivedDimensionIdentitiesAndCommutativity|DivideMassByVolumeAndMultiplyDensityByVolume|AbsoluteTemperaturesRejectAffineArithmetic|ParsingUsesOnlyExplicitProfileAliases|UnitCatalogIsStableSortedAndAliasSafe|DBSchenkerEuroPalletLoadingMetreFixture|CarrierVolumetricWeightFixtures|DSVEuroPalletVolumetricIndexFixture|DimensionsCalculateLoadingMetresWithStacking|VolumetricDivisorUsesExplicitVolumeUnit)$'
    count: 1
    timeout: 20m
- module: .
  gate: test
  steps:
  - type: make
    makefile: verification/package.mk
    target: architecture
    timeout: 20m
  - type: make
    makefile: verification/package.mk
    target: security
    timeout: 20m
- module: .
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: .
  gate: fuzz
  steps:
  - type: go-test
    packages: [.]
    fuzz: '^FuzzParseAndTextRoundTrip$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzQuantityJSON$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzQuantityXMLAndSQL$'
    budget: 10000x
    timeout: 20m
- module: .
  gate: benchmark
  steps:
  - type: go-test
    packages: [./...]
    benchmark: Benchmark
    budget: 100ms
    timeout: 20m
